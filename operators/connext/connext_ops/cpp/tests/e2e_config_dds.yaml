---
# E2E Test Configuration - DDS Mode
enable_dds: true
enable_ano: false
domain_id: 42
topic_name: "E2ETestTopic"
ano_channel: "E2ETestChannel"
expected_payload: "integration_test_payload"

# Time-based test configuration
test_duration_seconds: 20       # Run test for 20 seconds
message_period_ms: 1000         # Send message every 1000ms (1 msg/sec)
expected_message_count: 15      # With 5s delays, ~15s effective time = 15 messages
success_threshold_percent: 90   # Pass if we receive >= 90% (13/15 messages)

# RX Polling Configuration
rx_poll_period_ms: 100          # Poll every 100ms

# TX Configuration
tx_start_delay_ms: 3000         # Wait 3s for RX initialization
discovery_wait_ms: 2000         # Wait 2s for DDS discovery

scheduler:
  check_recession_period_ms: 0
  worker_thread_number: 2
  stop_on_deadlock: false

tx:
  enable_dds: true
  enable_ano: false
  domain_id: 42
  topic_name: "E2ETestTopic"
  ano_channel: "E2ETestChannel"

rx:
  enable_dds: true
  enable_ano: false
  domain_id: 42
  topic_name: "E2ETestTopic"
  ano_channel: "E2ETestChannel"
