# E2E Test Configuration - Mixed-Transport TX (ANO + DDS simultaneously)
#
# This configuration enables BOTH ANO (GPU Direct / DPDK) and DDS transports on a single
# TX container. ConnextTxOp dispatches each compute() to both paths concurrently:
#   - ANO path: GPU Direct via DPDK → RX1 (test_mixed_rx_ano.yaml)
#   - DDS path: standard DDS publish → RX2 (test_mixed_rx_dds.yaml)
#
# Required environment variables:
#   TEST_TX_NIC_PCIE - PCIe address of TX NIC (e.g., "0005:03:00.0")
#   TEST_RX_NIC_PCIE - PCIe address of RX NIC (e.g., "0005:03:00.1")

# Advanced Network Configuration for ANO physical NICs (ANO path only)
advanced_network:
  cfg:
    version: 1
    manager: "dpdk"
    master_core: 3
    log_level: "info"
    debug: true
    loopback: ""  # Empty string for disabled loopback (not 'disabled')

    memory_regions:
    - name: "Data_TX_GPU"
      kind: "device"
      affinity: 0
      num_bufs: 16384    # Reduced from 51200 to stay within SMMU budget on IGX Orin
      buf_size: 1064

    interfaces:
    - name: "tx_port"
      address: "0005:03:00.0"  # TX NIC PCIe address
      tx:
        queues:
        - name: "tx_q_0"
          id: 0
          batch_size: 1024
          cpu_core: 10
          timeout_us: 1000
          memory_regions:
            - "Data_TX_GPU"
          offloads:
            - "tx_eth_src"

scheduler:
  check_recession_period_ms: 0
  worker_thread_number: 5
  stop_on_deadlock: false

demo:
  mode: tx
  message_count: 0               # 0 = continuous mode (rate-based)
  message_period_ms: 100         # Send message every 100ms (10 msg/sec)
  discovery_wait_ms: 5000        # Wait 5s for ANO/DPDK init and DDS discovery

payload_source:
  base_payload: mixed_test_payload
  use_gpu_memory: true           # GPU memory works for both ANO and DDS paths

connext_tx:
  enable_dds: true               # DDS data plane ACTIVE
  enable_ano: true               # ANO GPU Direct ACTIVE
  domain_id: 42
  topic_name: E2ETestTopicMixed  # Distinct topic to avoid cross-talk with pure-DDS tests
  topic_type_name: HoloscanPayload
  ano_channel: E2ETestChannelMixed
  ano_buffer_id: e2e_mixed_buffer_tx
  ano_max_payload: 4096

  # ANO Network Configuration (for GPU Direct path)
  ano_network_interface: tx_port
  ano_gpu_device_id: 0
  ano_fast_ip: 192.168.10.10
  ano_fast_mac_address: "3c:6d:66:11:91:55"
  ano_fast_port: 7000
  ano_header_size: 64
  ano_max_packet_size: 9000
  ano_queue_id: 0
